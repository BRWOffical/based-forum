<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASED FORUM</title>
    <style>
        body {
            background-image: url('https://i.postimg.cc/WpM6nsSM/background.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            font-family: 'Impact', sans-serif;
            color: white;
            margin: 0;
            padding: 0;
        }

        #top-bar {
            background-color: red;
            border: 4px solid black;
            text-align: center;
            font-size: 48px;
            color: black;
            padding: 10px;
            margin: 0;
            text-shadow: 1px 1px white;
        }

        #sidebar {
            background-color: red;
            border-right: 4px solid black;
            width: 200px;
            position: fixed;
            top: 75px;
            bottom: 0;
            left: 0;
            display: none;
            padding-top: 20px;
        }

        .side-btn {
            display: block;
            background: transparent;
            color: white;
            font-family: 'Impact', sans-serif;
            font-size: 26px;
            text-align: center;
            border: none;
            margin: 25px 0;
            padding: 10px;
            text-decoration: none;
            cursor: pointer;
            text-shadow: 2px 2px black;
        }

        .side-btn:hover {
            color: darkred;
            text-shadow: 1px 1px white;
        }

        #login-screen {
            text-align: center;
            margin-top: 150px;
        }

        #login-screen h1 {
            font-size: 60px;
            text-shadow: 2px 2px black;
        }

        .auth-btn {
            color: red;
            font-size: 30px;
            cursor: pointer;
            text-decoration: underline;
            margin: 0 20px;
            text-shadow: 1px 1px black;
        }

        .modal {
            display: none;
            background: black;
            border: 4px solid red;
            width: 300px;
            margin: 20px auto;
            padding: 20px;
        }

        .modal input {
            display: block;
            width: 90%;
            margin: 10px auto;
            padding: 5px;
            font-family: 'Impact', sans-serif;
        }

        .modal button {
            background: red;
            color: black;
            font-family: 'Impact', sans-serif;
            font-size: 20px;
            cursor: pointer;
        }

        #forum-feed {
            display: none;
            margin-left: 260px;
            padding: 20px;
            max-width: 800px;
            margin-top: 20px;
        }

        .post {
            background: black;
            border: 3px solid red;
            margin-bottom: 30px;
            padding: 15px;
        }

        .post-user {
            display: flex;
            align-items: center;
            border-bottom: 2px dashed red;
            padding-bottom: 10px;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .post-user img {
            width: 50px;
            height: 50px;
            margin-right: 15px;
            border: 2px solid white;
        }

        .post-image {
            max-width: 100%;
            border: 1px solid white;
            margin-bottom: 10px;
        }

        .post-text {
            font-size: 20px;
            margin-bottom: 15px;
            word-break: break-word;
        }

        .post-controls button {
            background: red;
            color: black;
            font-family: 'Impact', sans-serif;
            border: 2px solid white;
            cursor: pointer;
            padding: 5px 10px;
            margin-right: 10px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="top-bar">BASED FORUM</div>

    <div id="sidebar">
        <a href="https://brwoffical.github.io/brutal-right-wing/" target="_blank" class="side-btn">Website</a>
        <a href="https://brwoffical.github.io/brw-joining/" target="_blank" class="side-btn">Socials</a>
        <a href="https://brwoffical.github.io/based-forum/post.html" class="side-btn">Post</a>
        <a href="https://brwoffical.github.io/based-forum/account" class="side-btn">Account</a>
        <a href="https://brwoffical.github.io/based-forum/search" class="side-btn">Search</a>
    </div>

    <div id="login-screen">
        <h1>LOGIN/REGISTER TO ENTER</h1>
        <span class="auth-btn" onclick="showModal('register-modal')">register</span>
        <span class="auth-btn" onclick="showModal('login-modal')">login</span>

        <div id="register-modal" class="modal">
            <h2>REGISTER</h2>
            <input type="text" id="reg-name" placeholder="Username (Max 20)" maxlength="20">
            <input type="password" id="reg-pass" placeholder="Password (Max 15)" maxlength="15">
            <button onclick="register()">Submit</button>
            <p id="reg-error" style="color:red;"></p>
        </div>

        <div id="login-modal" class="modal">
            <h2>LOGIN</h2>
            <input type="text" id="log-name" placeholder="Username">
            <input type="password" id="log-pass" placeholder="Password">
            <button onclick="login()">Submit</button>
            <p id="log-error" style="color:red;"></p>
        </div>
    </div>

    <!-- Empty container ready for posts -->
    <div id="forum-feed"></div>

    <script>
        // Init Supabase
        const SUPABASE_URL = 'https://pijgbmtbaslwgsyrjmlb.supabase.co';
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpamdibXRiYXNsd2dzeXJqbWxiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4MjY4NjcsImV4cCI6MjEwMzQwMjg2N30.3-vk1u_qPrjDi2fMe9L32JgTPcJU0SyPlErG5HS0IIo";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Get the logged in user
        const currentUser = localStorage.getItem("bf_user");

        // BAN CHECK & INIT PAGE
        async function initPage() {
            try {
                let res = await fetch('https://api.ipify.org?format=json');
                let data = await res.json();
                
                let { data: banned } = await supabaseClient
                    .from('banned_ips')
                    .select('*')
                    .eq('ip', data.ip);

                if (banned && banned.length > 0) {
                    document.body.innerHTML = `<div style="background:black; color:red; height:100vh; display:flex; justify-content:center; align-items:center; font-family:'Impact', sans-serif; font-size:100px;">Get banned LOL</div>`;
                    return;
                }

                if (currentUser) {
                    document.getElementById("login-screen").style.display = "none";
                    document.getElementById("sidebar").style.display = "block";
                    document.getElementById("forum-feed").style.display = "block";
                    loadPosts();
                }
            } catch(e) {
                console.log("Ban check error:", e);
            }
        }

        async function logUserIp(username) {
            try {
                let res = await fetch('https://api.ipify.org?format=json');
                let { ip } = await res.json();
                await supabaseClient.from('user_ips').insert([{ username: username, ip: ip }]);
            } catch(e) { console.log(e); }
        }

        // Fetch and display posts
        async function loadPosts() {
            let { data: posts, error } = await supabaseClient
                .from('posts')
                .select('*')
                .order('id', { ascending: false });

            let feed = document.getElementById("forum-feed");
            if (!feed) return;
            
            if (error) {
                console.log("Error loading posts:", error.message);
                return;
            }

            feed.innerHTML = "";

            for (let post of posts) {
                // Fetch comments for this specific post
                let { data: comments } = await supabaseClient
                    .from('comments')
                    .select('*')
                    .eq('post_id', post.id)
                    .order('id', { ascending: true });

                let commentsHTML = '';
                if (comments) {
                    comments.forEach(c => {
                        commentsHTML += `
                            <div style="background: #1a0000; border-top: 1px dashed red; padding: 8px 12px; margin-top: 5px; font-size: 16px;">
                                <strong style="color: red;">${c.username}:</strong> ${c.content}
                            </div>
                        `;
                    });
                }

                let hasValidImg = post.image_url && post.image_url.startsWith('http');
                let postHTML = `
                    <div class="post">
                        <div class="post-user">
                            <img src="${post.pfp || 'https://github.com/BRWOffical/based-forum/blob/main/pfp.png?raw=true'}" alt="PFP">
                            <span>${post.username}</span>
                        </div>
                        ${hasValidImg ? `<img class="post-image" src="${post.image_url}" alt="Post Image">` : ''}
                        <div class="post-text">${post.content}</div>
                        <div class="post-controls">
                            <button onclick="alert('Liked!')">Like</button>
                            <button onclick="alert('Disliked!')">Dislike</button>
                        </div>
                        
                        <!-- Comments Section -->
                        <div style="margin-top: 15px; border-top: 2px solid red; padding-top: 10px;">
                            <h4 style="margin: 0 0 10px 0; color: red;">COMMENTS</h4>
                            <div style="max-height: 200px; overflow-y: auto; margin-bottom: 10px;">
                                ${commentsHTML || '<p style="color: gray; font-size: 14px; margin: 5px 0;">No comments yet.</p>'}
                            </div>
                            <div style="display: flex; gap: 5px;">
                                <input type="text" id="comment-input-${post.id}" placeholder="Write a comment..." maxlength="1000" style="flex: 1; padding: 5px; background: #222; color: white; border: 1px solid red; font-family: 'Impact', sans-serif;">
                                <button onclick="addComment(${post.id})" style="background: red; color: black; border: 1px solid white; padding: 5px 10px; cursor: pointer; font-family: 'Impact', sans-serif;">REPLY</button>
                            </div>
                        </div>
                    </div>
                `;
                feed.innerHTML += postHTML;
            }
        }

        async function addComment(postId) {
            let input = document.getElementById(`comment-input-${postId}`);
            let content = input.value.trim();

            if (content === "") return;

            // Make sure someone is logged in before posting
            if (!currentUser) {
                alert("You must be logged in to comment!");
                return;
            }

            let { error } = await supabaseClient
                .from('comments')
                .insert([
                    { post_id: postId, username: currentUser, content: content }
                ]);

            if (error) {
                alert("Error posting comment: " + error.message);
            } else {
                input.value = "";
                loadPosts(); // Reload feed to show comment instantly
            }
        }

        function showModal(id) {
            document.getElementById('register-modal').style.display = 'none';
            document.getElementById('login-modal').style.display = 'none';
            document.getElementById(id).style.display = 'block';
        }

        async function register() {
            let name = document.getElementById("reg-name").value;
            let pass = document.getElementById("reg-pass").value;
            
            if (name === "" || pass === "") return;

            let users = JSON.parse(localStorage.getItem("bf_users")) || {};
            
            if (users[name]) {
                document.getElementById("reg-error").innerText = "Error: Name taken";
                return;
            }

            users[name] = pass;
            localStorage.setItem("bf_users", JSON.stringify(users));
            localStorage.setItem("bf_user", name);
            
            await logUserIp(name);
            window.location.reload();
        }

        async function login() {
            let name = document.getElementById("log-name").value;
            let pass = document.getElementById("log-pass").value;
            
            let users = JSON.parse(localStorage.getItem("bf_users")) || {};

            if (users[name] && users[name] === pass) {
                localStorage.setItem("bf_user", name);
                
                await logUserIp(name);
                window.location.reload();
            } else {
                document.getElementById("log-error").innerText = "Error: Wrong info";
            }
        }

        // Run ban check before showing anything
        initPage();
    </script>
</body>
</html>
